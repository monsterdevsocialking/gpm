name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, gd, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Run all migrations on a clean SQLite database
        run: |
          DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan migrate --force

      - name: Validate registered routes
        run: php artisan route:list --except-vendor

      - name: Run automated tests
        run: php artisan test

      - name: Compile Blade views
        run: php artisan view:cache
