name: Laravel quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_sqlite, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting for changed PHP files
        shell: bash
        run: |
          changed_php="$(git diff --name-only HEAD^ HEAD -- '*.php')"
          if [ -n "$changed_php" ]; then
            vendor/bin/pint --test $changed_php
          else
            echo "No PHP files changed in this commit."
          fi

      - name: Run automated tests
        run: php artisan test
